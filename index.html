<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" />
    <title>Odogwu Empire | Buy the Land. Become the Odogwu.</title>
    <meta
      name="description"
      content="A pan-Nigerian online multiplayer property-trading board game. Buy properties from Maiduguri to Ikoyi, charge rent in Naira, draw Pidgin Chance cards, and bankrupt your friends. Free, 2–6 players, no download."
    />
    <!-- Open Graph / WhatsApp / Twitter — invite links get a rich preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Odogwu Empire — Buy the Land. Become the Odogwu." />
    <meta
      property="og:description"
      content="Nigerian multiplayer property game. Free in your browser, 2–6 players. Join your friends' room with one tap."
    />
    <meta property="og:site_name" content="Odogwu Empire" />
    <meta property="og:image" content="/social-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1469" />
    <meta property="og:image:height" content="812" />
    <meta
      property="og:image:alt"
      content="Odogwu Empire landing page with the game title, start button, and feature cards."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Odogwu Empire — Buy the Land. Become the Odogwu." />
    <meta
      name="twitter:description"
      content="Nigerian multiplayer property game. Free in your browser, 2–6 players."
    />
    <meta name="twitter:image" content="/social-preview.jpg" />
    <!-- No web-font request. Figtree is self-hosted (@font-face in
         tokens.css); preloaded here so it is already in flight when the
         stylesheet asks for it. -->
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* First paint is the v2 landing (warm sand), so paint that immediately
         to avoid a dark flash before React mounts. Legacy dark screens
         (lobby/game) opt back into the dark ground in v2.css until they are
         rebuilt against the light system. */
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #faf7f2;
        color: #101828;
        font-family: "Figtree", "Segoe UI", Roboto, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
